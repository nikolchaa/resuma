name: Build and check

# Three levels of checks, by cost:
# - Every push and pull request: frontend and Rust tests on Linux.
# - Pull requests to main, pushes to release/* branches and manual runs:
#   the installers for all six platforms, each started once, and the x64
#   AppImage started under Wayland on Arch Linux.
# - Local AI on all six platforms (one llama.cpp request and one job
#   matching request through the app's own code): on release/* pushes,
#   on pull requests that change the code or runtimes behind those
#   requests, and on manual runs that ask for it.
# The installers are kept as workflow artifacts for testing. Releases
# themselves are built by release.yml.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: Build the installers on all six platforms
        type: boolean
        default: true
      local-ai:
        description: Run local AI and job matching on all six platforms
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

  rust:
    name: Rust tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: rust-tests

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libappindicator3-dev \
            librsvg2-dev

      # The Rust crate embeds the built frontend.
      - name: Build the frontend
        run: |
          npm ci
          npm run build

      - name: Rust tests
        shell: bash
        working-directory: src-tauri
        run: ../.github/scripts/run-logged.sh "Rust tests" cargo test --lib

  # Decides which of the costly checks below this run needs.
  scope:
    name: Choose checks
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.scope.outputs.platforms }}
      local-ai: ${{ steps.scope.outputs.local-ai }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          WANT_PLATFORMS: ${{ inputs.platforms }}
          WANT_LOCAL_AI: ${{ inputs.local-ai }}
        run: |
          platforms=false
          local_ai=false
          case "$EVENT" in
            workflow_dispatch)
              platforms="$WANT_PLATFORMS"
              local_ai="$WANT_LOCAL_AI"
              ;;
            pull_request)
              platforms=true
              # The code and data behind a local AI request, and these checks.
              if git diff --name-only "$BASE" HEAD | grep -qE '^(src-tauri/src/(llm|reranker|gpu_offload|gguf)\.rs|src-tauri/Cargo\.(toml|lock)|src/data/runtimes\.json|\.github/)'; then
                local_ai=true
              fi
              ;;
            push)
              case "$REF" in
                refs/heads/release/*)
                  platforms=true
                  local_ai=true
                  ;;
              esac
              ;;
          esac
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "local-ai=$local_ai" >> "$GITHUB_OUTPUT"
          echo "::notice title=Checks::installers on all platforms: $platforms, local AI on all platforms: $local_ai"

  build:
    name: ${{ matrix.name }}
    needs: scope
    if: needs.scope.outputs.platforms == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            slug: windows-x64
          - name: Windows ARM
            os: windows-11-arm
            slug: windows-arm64
          - name: macOS Apple silicon
            os: macos-latest
            slug: macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            slug: macos-x64
          # The oldest supported Ubuntu, so the packages run on as many
          # distributions as possible.
          - name: Linux x64
            os: ubuntu-22.04
            slug: linux-x64
          - name: Linux ARM
            os: ubuntu-22.04-arm
            slug: linux-arm64

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.slug }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils \
            xvfb

      - name: Install frontend dependencies
        run: npm ci

      # Each step below publishes the end of its output as an annotation if
      # it fails (see run-logged.sh), so failures can be read without signing
      # in. Once the installers are built, every check runs even if another
      # one failed, so one failure doesn't hide the rest.
      - name: Build the installers
        id: build
        shell: bash
        # macOS runners sometimes fail making the .dmg ("hdiutil: resource
        # busy"); one retry reuses the compiled app.
        run: |
          .github/scripts/run-logged.sh "Build" npx tauri build || {
            [ "$RUNNER_OS" = "macOS" ] && .github/scripts/run-logged.sh "Build (retry)" npx tauri build
          }

      # The installer names, so the website's download patterns can be checked.
      - name: List the installers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          shopt -s nullglob
          cd src-tauri/target/release/bundle
          names=""
          for f in nsis/*.exe dmg/*.dmg deb/*.deb rpm/*.rpm appimage/*.AppImage; do names+="$(basename "$f") "; done
          echo "::notice title=Installers::$names"

      # Platform-specific code (processes, paths) beyond Linux.
      - name: Rust tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        working-directory: src-tauri
        run: ../.github/scripts/run-logged.sh "Rust tests" cargo test --lib

      - name: Start the app
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          RESUMA_SMOKE_TEST: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            .github/scripts/run-logged.sh "Start-up" xvfb-run -a ./src-tauri/target/release/Resuma
          else
            .github/scripts/run-logged.sh "Start-up" ./src-tauri/target/release/Resuma
          fi

      # The AppImage must leave libwayland-client to the system: a copy
      # bundled from Ubuntu 22.04 is too old for current Mesa, and WebKit
      # then aborts with "Could not create default EGL display:
      # EGL_BAD_PARAMETER" (1.1.2 on Arch with Mesa 26).
      - name: Check the AppImage's libraries
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE"/src-tauri/target/release/bundle/appimage/*.AppImage --appimage-extract >/dev/null
          bundled="$(find squashfs-root -name 'libwayland-*.so*' -printf '%f\n' | sort | tr '\n' ' ')"
          echo "::notice title=Wayland libraries in the AppImage::${bundled:-none}"
          backend="$(grep -rhs 'GDK_BACKEND' squashfs-root/AppRun* squashfs-root/apprun-hooks | sed 's/^ *//' | sort -u | tr '\n' ' ')"
          echo "::notice title=GDK_BACKEND in the AppImage's start-up scripts::${backend:-not set}"
          if find squashfs-root -name 'libwayland-client.so*' | grep -q .; then
            echo "::error title=AppImage::The AppImage bundles libwayland-client, which makes WebKit abort on current Mesa."
            exit 1
          fi

      - name: Keep the installers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: resuma-${{ matrix.slug }}
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  # The x64 AppImage on a current rolling-release desktop stack: Arch Linux
  # with the latest Mesa, under Wayland (Weston, with Xwayland). The other
  # start-up checks run on the Ubuntu the installers are built on. There is
  # no GPU here, so WebKit renders in software: this catches libraries that
  # won't load at all, but not 1.1.2's crash, which needs a GPU to show and
  # is covered by the library check in the build job.
  appimage-wayland:
    name: AppImage on Arch Linux (Wayland)
    needs: [scope, build]
    if: ${{ !cancelled() && needs.scope.outputs.platforms == 'true' }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Weston, Xwayland and Mesa
        run: |
          pacman -Syu --noconfirm --needed weston xorg-xwayland mesa gtk3 ttf-dejavu dbus
          useradd -m tester

      - uses: actions/download-artifact@v8
        with:
          name: resuma-linux-x64
          path: installers

      - name: Start the AppImage
        shell: bash
        run: |
          app="$(realpath installers/appimage/*.AppImage)"
          chmod 755 "$app"
          runuser -u tester -- .github/scripts/run-logged.sh "AppImage on Wayland" \
            .github/scripts/appimage-wayland.sh "$app"

  # One llama.cpp request with the light model and one job matching request,
  # through the app's own code, on the llama.cpp build the app picks for each
  # platform. A smoke test: it checks that local AI runs and answers, not
  # what it answers, which varies with the hardware and the build.
  local-ai:
    name: Local AI on ${{ matrix.name }}
    needs: scope
    if: needs.scope.outputs.local-ai == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: Windows ARM
            os: windows-11-arm
          - name: macOS Apple silicon
            os: macos-latest
          - name: macOS Intel
            os: macos-15-intel
          - name: Linux x64
            os: ubuntu-22.04
          # llama.cpp's Linux ARM build needs glibc 2.38 or newer.
          - name: Linux ARM
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: local-ai-${{ matrix.os }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            librsvg2-dev
          # Ubuntu 24.04 replaced libappindicator with the Ayatana fork.
          sudo apt-get install -y libappindicator3-dev || sudo apt-get install -y libayatana-appindicator3-dev

      # The Rust crate embeds the built frontend.
      - name: Build the frontend
        run: |
          npm ci
          npm run build

      - name: Download a llama.cpp build, the light model and the job matching model
        shell: bash
        run: .github/scripts/run-logged.sh "Local AI download" node .github/scripts/local-ai-check.mjs

      - name: Run one local AI request and one job matching request
        shell: bash
        working-directory: src-tauri
        run: ../.github/scripts/run-logged.sh "Local AI requests" cargo test --lib real_ -- --ignored --nocapture --test-threads=1
