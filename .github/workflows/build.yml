name: Build and check

# Builds the installers for every platform and checks that each one starts
# and can run local AI, without publishing anything. The installers are kept
# as workflow artifacts for testing.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            slug: windows-x64
          - name: Windows ARM
            os: windows-11-arm
            slug: windows-arm64
          - name: macOS Apple silicon
            os: macos-latest
            slug: macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            slug: macos-x64
          # The oldest supported Ubuntu, so the packages run on as many
          # distributions as possible.
          - name: Linux x64
            os: ubuntu-22.04
            slug: linux-x64
          - name: Linux ARM
            os: ubuntu-22.04-arm
            slug: linux-arm64

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.slug }}

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xvfb

      - name: Install frontend dependencies
        run: npm ci

      # Each step below publishes the end of its output as an annotation if
      # it fails (see run-logged.sh), so failures can be read without signing in.
      - name: Build the installers
        shell: bash
        run: .github/scripts/run-logged.sh "Build" npx tauri build

      - name: Rust tests
        shell: bash
        working-directory: src-tauri
        run: ../.github/scripts/run-logged.sh "Rust tests" cargo test --lib

      - name: Download a llama.cpp build and the light model
        shell: bash
        run: .github/scripts/run-logged.sh "Local AI download" node .github/scripts/local-ai-check.mjs

      - name: Run one local AI request
        shell: bash
        working-directory: src-tauri
        run: ../.github/scripts/run-logged.sh "Local AI request" cargo test --lib real_local_request -- --ignored --nocapture

      - name: Start the app
        shell: bash
        env:
          RESUMA_SMOKE_TEST: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            .github/scripts/run-logged.sh "Start-up" xvfb-run -a ./src-tauri/target/release/Resuma
          else
            .github/scripts/run-logged.sh "Start-up" ./src-tauri/target/release/Resuma
          fi

      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: resuma-${{ matrix.slug }}
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
