name: Build and Release with Tauri Action

# Builds every platform for a version tag and uploads the installers to a
# draft release. Nothing is public until the draft is published by hand,
# after every platform has uploaded.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# The release is created and its assets uploaded with the workflow's own
# token, so there is no personal access token to expire.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: Windows ARM
            os: windows-11-arm
          - name: macOS Apple silicon
            os: macos-latest
          - name: macOS Intel
            os: macos-15-intel
          # The oldest supported Ubuntu, so the packages run on as many
          # distributions as possible.
          - name: Linux x64
            os: ubuntu-22.04
          - name: Linux ARM
            os: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils

      # Also installs the Tauri CLI (a dev dependency), which tauri-action uses.
      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Resuma v__VERSION__ ✨"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
